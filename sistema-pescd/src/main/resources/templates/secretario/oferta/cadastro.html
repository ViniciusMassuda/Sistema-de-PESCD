<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::content})}">
<body>

<div th:fragment="content">

    <h2 th:text="${oferta.id == null} ? 'Nova Oferta' : 'Editar Oferta'">
        Oferta
    </h2>

    <form th:action="@{/secretario/ofertas/salvar}"
          th:object="${oferta}"
          method="post"
          class="mt-3">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="nome" class="form-label">
                Nome
            </label>

            <input type="text"
                   th:field="*{nome}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:errors="*{nome}">
            </div>
        </div>

        <div class="mb-3">
            <label for="semestre" class="form-label">
                Semestre
            </label>

            <input type="text"
                   th:field="*{semestre}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:errors="*{semestre}">
            </div>
        </div>

        <div class="mb-3">
            <label for="dataInicio" class="form-label">
                Data de Início
            </label>

            <input type="date"
                   th:field="*{dataInicio}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:errors="*{dataInicio}">
            </div>
        </div>

        <div class="mb-3">
            <label for="dataFim" class="form-label">
                Data de Fim
            </label>

            <input type="date"
                   th:field="*{dataFim}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:errors="*{dataFim}">
            </div>
        </div>

        <div class="mb-3">
            <label for="professorResponsavel"
                   class="form-label">
                Professor Responsável
            </label>

            <select th:field="*{professorResponsavel}"
                    class="form-select">

                <option value="">
                    Selecione um professor
                </option>

                <option th:each="p : ${professores}"
                        th:value="${p.id}"
                        th:text="${p.nome}">
                </option>

            </select>
        </div>

        <button type="submit"
                class="btn btn-success">
            Salvar
        </button>

        <a th:href="@{/secretario/ofertas}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
