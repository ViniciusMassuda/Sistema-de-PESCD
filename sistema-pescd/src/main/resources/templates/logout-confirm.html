<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content" class="d-flex justify-content-center align-items-center" style="min-height: 50vh;">
    <div class="card shadow-lg p-4 text-center border-0" style="max-width: 450px; border-radius: 16px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
        <div class="card-body">
            <!-- Ícone de Logout -->
            <div class="mb-4 text-warning">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                    <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                </svg>
            </div>
            
            <h3 class="card-title fw-bold mb-3 text-dark">Deseja realmente sair?</h3>
            <p class="text-muted mb-4">Você está prestes a encerrar a sua sessão atual no sistema de PESCD.</p>
            
            <div class="row g-2">
                <div class="col-sm-6">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold" style="border-radius: 8px;">
                            Sim, Sair
                        </button>
                    </form>
                </div>
                <div class="col-sm-6">
                    <a th:href="@{/}" class="btn btn-light w-100 py-2 fw-semibold border" style="border-radius: 8px;">
                        Cancelar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
