<!DOCTYPE html>
<html th:fragment="layout (content)" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>PESCD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>PESCD
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:text="#{label.home}">Home</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                    <a class="nav-link" th:href="@{/admin/usuarios}" th:text="#{label.users}">Users</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <!-- Usuário logado - Mostra o nome completo do banco -->
                <div class="me-3" sec:authorize="isAuthenticated()">
                        <span class="text-white">
                            <i class="bi bi-person-circle"></i>
                            <strong th:text="${session.usuarioNome != null ? session.usuarioNome : #authentication.name}">Usuário</strong>
                            <small class="text-light">([[${#authentication.authorities[0].authority.replace('ROLE_', '')}]])</small>
                        </span>
                </div>

                <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-in-right"></i> <span th:text="#{label.login}">Login</span>
                </a>

                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm ms-2">
                        <i class="bi bi-box-arrow-right"></i> <span th:text="#{label.logout}">Logout</span>
                    </button>
                </form>

                <!-- Seletor de idioma - Mantém na mesma página -->
                <div class="ms-3 border-start border-light ps-3">
                    <a th:href="@{''(lang='pt')}" class="text-white text-decoration-none me-1">PT</a>
                    <span class="text-white">|</span>
                    <a th:href="@{''(lang='en')}" class="text-white text-decoration-none ms-1">EN</a>
                </div>
            </div>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:replace="${content}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
