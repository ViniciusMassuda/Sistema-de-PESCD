<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content" style="padding: 20px;">
    <h2 th:text="#{professor.concluir_relatorio.titulo}">Concluir Relatório Final (Professor Responsável)</h2>
    <p><strong th:text="#{professor.lista.aluno}">Aluno</strong>: <span th:text="${inscricao.aluno.nome}"></span></p>
    <hr>
    <h3 th:text="#{professor.concluir_relatorio.avaliacao_supervisor}">Avaliação do Supervisor</h3>
    <p><strong th:text="#{professor.concluir_relatorio.parecer_supervisor}">Parecer do Supervisor:</strong> <span th:text="${inscricao.parecerRelatorioSupervisor}"></span></p>
    <p><strong th:text="#{professor.concluir_relatorio.frequencia_sugerida}">Frequência Sugerida:</strong> <span th:text="${inscricao.frequenciaSupervisor}"></span>%</p>
    <p><strong th:text="#{professor.concluir_relatorio.nota_sugerida}">Nota Sugerida:</strong> <span th:text="${inscricao.notaSupervisor}"></span></p>
    <hr>
    <form th:action="@{/professor/concluir-relatorio}" method="post">
        <input type="hidden" name="inscricaoId" th:value="${inscricao.id}" />
        <h3 th:text="#{professor.concluir_relatorio.sua_avaliacao}">Sua Avaliação Final</h3>
        
        <label for="parecerResponsavel" th:text="#{professor.concluir_relatorio.parecer_final}">Parecer Final:</label><br>
        <textarea id="parecerResponsavel" name="parecerResponsavel" style="width: 100%; min-height: 100px;" required></textarea><br><br>
        
        <label for="frequenciaResponsavel" th:text="#{professor.concluir_relatorio.frequencia_definitiva}">Frequência Definitiva (%):</label><br>
        <input type="number" id="frequenciaResponsavel" name="frequenciaResponsavel" min="0" max="100" required><br><br>
        
        <label for="notaResponsavel" th:text="#{professor.concluir_relatorio.nota_definitiva}">Nota Definitiva:</label><br>
        <select id="notaResponsavel" name="notaResponsavel" required>
            <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option>
        </select><br><br>
        
        <button type="submit" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;" th:text="#{professor.lista.btn.concluir_final}">Concluir Avaliação</button>
        <a th:href="@{/professor/lista-alunos}" style="margin-left: 10px; color: #6c757d; text-decoration: none;" th:text="#{label.cancel}">Cancelar</a>
    </form>
</div>
</body>
</html>
