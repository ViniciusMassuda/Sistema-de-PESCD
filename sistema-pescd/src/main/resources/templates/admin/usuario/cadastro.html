<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <h2 th:text="${usuario.id == null} ? #{label.newUser} : #{label.editUser}">User</h2>
        <form th:action="@{/admin/usuarios/salvar}" th:object="${usuario}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="nome" class="form-label" th:text="#{label.name}">Name</label>
                <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label" th:text="#{label.username}">Username</label>
                <input type="text" th:field="*{username}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label" th:text="#{label.password}">Password</label>
                <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label" th:text="#{label.role}">Role</label>
                <select th:field="*{role}" class="form-select">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-success" th:text="#{label.save}">Save</button>
            <a th:href="@{/admin/usuarios}" class="btn btn-secondary" th:text="#{label.cancel}">Cancel</a>
        </form>
    </div>
</body>
</html>
