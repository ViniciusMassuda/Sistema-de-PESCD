<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="#{aluno.enviar_documentacao.titulo}">Enviar Documentação Comprobatória</h2>
            <a th:href="@{/aluno/ofertas}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> <span th:text="#{label.back}">Voltar</span>
            </a>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="#{aluno.enviar_documentacao.subtitulo}">Dados da Documentação</h5>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                <form th:action="@{/aluno/oferta/{id}/documentacao(id=${ofertaId})}"
                      method="post"
                      enctype="multipart/form-data"
                      th:object="${documentacaoRequest}">

                    <!-- CSRF Token - necessário para o Spring Security -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="instituicao" class="form-label" th:text="#{aluno.enviar_documentacao.instituicao}">Instituição</label>
                        <input type="text" class="form-control" id="instituicao"
                               th:field="*{instituicao}" required>
                    </div>

                    <div class="mb-3">
                        <label for="nomeDisciplina" class="form-label" th:text="#{aluno.enviar_documentacao.nome_disciplina}">Nome da Disciplina</label>
                        <input type="text" class="form-control" id="nomeDisciplina"
                               th:field="*{nomeDisciplina}" required>
                    </div>

                    <div class="mb-3">
                        <label for="cursoDisciplina" class="form-label" th:text="#{aluno.enviar_documentacao.curso}">Curso</label>
                        <input type="text" class="form-control" id="cursoDisciplina"
                               th:field="*{cursoDisciplina}" required>
                    </div>

                    <div class="mb-3">
                        <label for="cargaHoraria" class="form-label" th:text="#{aluno.enviar_documentacao.carga_horaria}">Carga Horária (horas)</label>
                        <input type="number" class="form-control" id="cargaHoraria"
                               th:field="*{cargaHoraria}" required min="1">
                    </div>

                    <div class="mb-3">
                        <label for="arquivo" class="form-label" th:text="#{aluno.enviar_documentacao.arquivo}">Documentação Comprobatória (PDF)</label>
                        <input type="file" class="form-control" id="arquivo"
                               name="arquivo" accept="application/pdf" required>
                        <div class="form-text" th:text="#{aluno.enviar_documentacao.arquivo_help}">PDF com no máximo 5MB</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/aluno/ofertas}" class="btn btn-secondary" th:text="#{label.cancel}">Cancelar</a>
                        <button type="submit" id="submitBtn" class="btn btn-primary" th:text="#{label.send}">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
