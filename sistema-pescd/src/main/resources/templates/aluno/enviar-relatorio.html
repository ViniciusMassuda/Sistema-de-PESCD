<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="#{aluno.enviar_relatorio.titulo}">Enviar Relatório Final</h2>
            <a th:href="@{/aluno/ofertas}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> <span th:text="#{label.back}">Voltar</span>
            </a>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0" th:text="#{aluno.enviar_relatorio.dados_oferta}">Dados da Oferta e Plano de Trabalho</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong th:text="#{label.name}">Oferta:</strong> <span th:text="${ofertaNome}"></span></p>
                        <p><strong th:text="#{aluno.enviar_relatorio.codigo_disciplina}">Código:</strong> <span th:text="${planoTrabalho.codigoDisciplina}"></span></p>
                        <p><strong th:text="#{aluno.enviar_relatorio.nome_disciplina}">Disciplina:</strong> <span th:text="${planoTrabalho.nomeDisciplina}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong th:text="#{aluno.enviar_relatorio.curso_disciplina}">Curso:</strong> <span th:text="${planoTrabalho.cursoDisciplina}"></span></p>
                        <p><strong th:text="#{aluno.enviar_relatorio.professor_supervisor}">Supervisor:</strong> <span th:text="${planoTrabalho.professorSupervisor.nome}"></span></p>
                        <p><strong th:text="#{aluno.enviar_relatorio.data_envio_plano}">Data envio plano:</strong> <span th:text="${#temporals.format(planoTrabalho.dataEnvio, 'dd/MM/yyyy HH:mm')}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="#{aluno.enviar_relatorio.subtitulo}">Dados do Relatório Final</h5>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/aluno/oferta/{id}/relatorio(id=${ofertaId})}"
                      method="post"
                      enctype="multipart/form-data"
                      th:object="${relatorioRequest}">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="frequencia" class="form-label" th:text="#{aluno.enviar_relatorio.frequencia}">Indicador de Frequência (%)</label>
                        <input type="number" class="form-control" id="frequencia"
                               th:field="*{frequencia}" required min="0" max="100">
                        <div class="form-text" th:text="#{aluno.enviar_relatorio.frequencia_help}">Valor entre 0 e 100%</div>
                    </div>

                    <div class="mb-3">
                        <label for="arquivo" class="form-label" th:text="#{aluno.enviar_relatorio.arquivo}">Relatório Final (PDF)</label>
                        <input type="file" class="form-control" id="arquivo"
                               name="arquivo" accept="application/pdf" required>
                        <div class="form-text" th:text="#{aluno.enviar_relatorio.arquivo_help}">PDF com no máximo 5MB</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/aluno/ofertas}" class="btn btn-secondary" th:text="#{label.cancel}">Cancelar</a>
                        <button type="submit" id="submitBtn" class="btn btn-primary" th:text="#{label.send}">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
