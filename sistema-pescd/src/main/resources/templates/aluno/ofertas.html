<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="#{aluno.minhas_ofertas}">Minhas Ofertas</h2>
        </div>

        <div th:if="${semOfertas}" class="alert alert-warning" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="#{aluno.sem_ofertas}">Você não está inscrito em nenhuma oferta.</span>
        </div>

        <div th:unless="${semOfertas}">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th th:text="#{label.name}">Nome da Oferta</th>
                        <th th:text="#{label.semester}">Semestre</th>
                        <th th:text="#{label.startDate}">Data Início</th>
                        <th th:text="#{label.endDate}">Data Fim</th>
                        <th th:text="#{label.responsible}">Professor Responsável</th>
                        <th th:text="#{aluno.status_oferta}">Status da Oferta</th>
                        <th th:text="#{label.actions}">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="oferta : ${ofertas}">
                        <td th:text="${oferta.nomeOferta}">Nome</td>
                        <td th:text="${oferta.semestre}">Semestre</td>
                        <td th:text="${#temporals.format(oferta.dataInicio, 'dd/MM/yyyy')}">Início</td>
                        <td th:text="${#temporals.format(oferta.dataFim, 'dd/MM/yyyy')}">Fim</td>
                        <td th:text="${oferta.professorResponsavel}">Professor</td>
                        <td>
                            <span th:class="'badge ' + (${oferta.statusOferta == 'Em andamento'} ? 'bg-success' : (${oferta.statusOferta == 'Atrasada'} ? 'bg-danger' : 'bg-secondary'))"
                                  th:text="#{${'aluno.status.' + (oferta.statusOferta == 'Em andamento' ? 'em_andamento' : (oferta.statusOferta == 'Atrasada' ? 'atrasada' : 'nao_iniciada'))}}">
                                Status
                            </span>
                        </td>
                        <td>
                            <!-- Botão único que muda conforme o status -->
                            <div th:if="${oferta.statusOferta == 'Em andamento'}">

                                <!-- Caso 1: Status = "não enviado" → Mostrar "Enviar Plano" e "Enviar Documentação" -->
                                <div th:if="${oferta.statusAluno == 'não enviado'}">
                                    <a th:href="@{/aluno/oferta/{id}/plano(id=${oferta.id})}"
                                       class="btn btn-sm btn-primary me-1">
                                        <i class="bi bi-file-earmark-text"></i> Enviar Plano
                                    </a>
                                    <a th:href="@{/aluno/oferta/{id}/documentacao(id=${oferta.id})}"
                                       class="btn btn-sm btn-info me-1">
                                        <i class="bi bi-file-earmark-pdf"></i> Enviar Documentação
                                    </a>
                                </div>

                                <!-- Caso 2: Status = "plano enviado" → Mostrar "Plano enviado" (desabilitado) -->
                                <span th:if="${oferta.statusAluno == 'plano enviado'}"
                                      class="btn btn-sm btn-secondary disabled me-1">
                                    <i class="bi bi-clock-history"></i> Plano enviado
                                </span>

                                <!-- Caso 3: Status = "documentação enviada" → Mostrar "Documentação enviada" (desabilitado) -->
                                <span th:if="${oferta.statusAluno == 'documentação enviada'}"
                                      class="btn btn-sm btn-secondary disabled me-1">
                                    <i class="bi bi-check-circle"></i> Documentação enviada
                                </span>

                                <!-- Caso 4: Status = "plano aprovado" → Mostrar "Enviar Documentação" (sequencial) -->
                                <a th:if="${oferta.statusAluno == 'plano aprovado'}"
                                   th:href="@{/aluno/oferta/{id}/documentacao(id=${oferta.id})}"
                                   class="btn btn-sm btn-info me-1">
                                    <i class="bi bi-file-earmark-pdf"></i> Enviar Documentação
                                </a>

                            </div>

                            <!-- Mensagem quando oferta não está em andamento -->
                            <span th:if="${oferta.statusOferta != 'Em andamento'}" class="text-muted">
                                <i class="bi bi-lock"></i> <span th:text="#{aluno.enviar_plano.indisponivel}">Indisponível</span>
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
