<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <h2 th:text="#{label.offers}">Offers</h2>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th th:text="#{label.name}">Name</th>
                    <th th:text="#{label.semester}">Semester</th>
                    <th th:text="#{label.startDate}">Start</th>
                    <th th:text="#{label.endDate}">End</th>
                    <th th:text="#{label.responsible}">Responsible</th>
                    <th th:text="#{label.enrolled}">Enrolled</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="oferta : ${ofertas}">
                    <td th:text="${oferta.nome}"></td>
                    <td th:text="${oferta.semestre}"></td>
                    <td th:text="${#temporals.format(oferta.dataInicio, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(oferta.dataFim, 'dd/MM/yyyy')}"></td>
                    <td th:text="${oferta.professorResponsavel.nome}"></td>
                    <td th:text="${inscritosMap.get(oferta.id)}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
