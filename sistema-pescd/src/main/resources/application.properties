# Spring Boot encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8
# Para garantir que o Thymeleaf use UTF-8
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

spring.messages.fallback-to-system-locale=false
spring.application.name=sistema-pescd
spring.datasource.url=jdbc:h2:mem:pescd;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
# Habilita o Hibernate para criar o schema ANTES do script SQL rodar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.messages.basename=messages
# Aumenta o log para ver exatamente o que acontece no banco e seguranca
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Upload de arquivos (NOVO)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true
# Caminho para salvar os uploads (NOVO)
upload.path=src/main/resources/static/uploads
spring.servlet.multipart.resolve-lazily=true